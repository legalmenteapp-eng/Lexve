*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--side-bg);color:var(--side-fg);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--f-display);font-size:26px;color:#fff;letter-spacing:.5px}
.logo b{color:var(--gold);font-weight:700}
.despacho{font-size:12px;opacity:.75;margin-top:-12px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--side-fg)}
nav button:hover{background:rgba(255,255,255,.07)}
nav button[aria-current="true"]{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}

.usuario{margin-top:auto;font-size:12px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.usuario strong{display:block;color:#fff;font-size:13px}
main{padding-block:28px 48px;padding-inline:32px;min-width:0}
.aviso{background:var(--gold-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:20px}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 4px;text-wrap:balance;color:var(--fg)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .t{font-size:12px;color:var(--muted)}

.kpi .d{font-size:12px;color:var(--muted)}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}

.cab .codigo{font-family:var(--f-mono);font-size:15px;color:var(--muted)}

dl.datos dd{margin:0}

.prosa p{margin:.5em 0}

.factura{max-width:720px}
.factura header{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--fg);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.tot{margin-left:auto;width:min(100%,300px);display:grid;gap:4px;margin-top:14px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .g{border-top:1px solid var(--line);padding-top:6px;font-weight:600;font-size:15px}
.meter{height:7px;border-radius:4px;background:var(--line)}

.side{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.form{display:grid;gap:10px}

  if(estado.tab==="horas")cuerpo=`<div class="side"><section class="card"><h2>Resumen</h2><dl class="datos"><div><dt>Horas registradas</dt><dd>${c.h}</dd></div><div><dt>Pendiente por facturar</dt><dd>${usd(c.pf)}</dd></div></dl><p class="small">La app muestra cada registro por abogado, fecha y actividad, y los gastos reembolsables (aranceles, copias certificadas, traslados).</p></section>
   <section class="card form"><h2>Registrar horas</h2><input type="date" value="2026-10-04" aria-label="Fecha"><input placeholder="Horas" inputmode="decimal"><input placeholder="Actividad realizada"><button class="btn" onclick="toast('Horas registradas (simulado)')">Registrar</button></section></div>`;
  if(estado.tab==="facturas"){const fs=D.fact.filter(f=>f[2]===c.c);cuerpo=`<section class="card barra" style="justify-content:space-between"><div><div class="small">Horas y gastos pendientes por facturar</div><div style="font-family:var(--f-display);font-size:24px">${usd(c.pf)}</div></div><button class="btn" onclick="toast('Factura borrador generada con las horas y gastos pendientes (simulado)')">Generar factura borrador</button></section>
   <section class="card scroll" style="padding:0;margin-top:14px"><table><thead><tr><th>Factura</th><th>Emisión</th><th>Estado</th><th class="num">Total</th><th class="num">Saldo</th></tr></thead><tbody>${fs.map(f=>`<tr class="click" data-fact="${f[0]}"><td class="mono">${f[0]}</td><td>${fe(f[3])}</td><td>${chipE(f[5])}</td><td class="num">${usd(f[9])}</td><td class="num">${usd(f[9]-f[10])}</td></tr>`).join("")||'<tr><td colspan="5" class="small">Sin facturas.</td></tr>'}</tbody></table></section>`}
  return `<button class="link small" onclick="ir('casos')">← Casos</button>
  <div class="cab" style="margin-top:6px"><span class="codigo">${c.c}</span>${chipE(c.e)}${prio(c.p)}<span class="chip c-gold">${MAT[c.m]}</span><button class="btn sec" style="margin-left:auto" onclick="toast('Abre el informe imprimible del caso (PDF) en la app real')">Informe del caso</button></div>
  <h1>${esc(c.t)}</h1><p class="sub">${esc(c.cl)} · Exp. <span class="mono">${c.exp}</span> · ${esc(c.et)}</p>
  <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${estado.tab===k}">${t}</button>`).join("")}</div>${cuerpo}`;
}
function clientes(){return `<h1>Clientes</h1><p class="sub">${D.clientes.length} clientes · cada uno puede vincular su carpeta de Google Drive</p>
 <div class="card scroll" style="padding:0"><table><thead><tr><th>Cliente</th><th>Cédula / RIF</th><th>Contacto</th><th>Ciudad</th><th class="num">Casos</th><th>Drive</th></tr></thead><tbody>
 ${D.clientes.map(c=>`<tr><td style="font-weight:500">${esc(c[0])}<div class="small">Persona ${c[1].toLowerCase()}</div></td><td class="mono">${c[2]}</td><td class="small">${c[3]}</td><td>${c[4]}</td><td class="num">${c[5]}</td><td>${c[6]?'<span class="chip c-ok">vinculada</span>':'<span class="chip c-neutral">sin carpeta</span>'}</td></tr>`).join("")}</tbody></table></div>`}
function tsj(){return `<h1>Jurisprudencia del TSJ</h1><p class="sub">Busca en tsj.gob.ve con IA, importa sentencias por URL y vincúlalas a tus casos</p>
 <div class="side" style="grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)">
  <section class="card form"><h2>Buscar en el TSJ con IA</h2><textarea id="qtsj" rows="3">perención breve de la instancia por falta de impulso de la citación</textarea><select aria-label="Sala"><option>Todas las salas</option><option>Sala Constitucional</option><option>Sala de Casación Civil</option><option>Sala de Casación Social</option><option>Sala Político-Administrativa</option></select><button class="btn" id="btsj">Buscar</button>
  <div id="restsj" class="small">La búsqueda solo muestra sentencias con enlace verificable a tsj.gob.ve.</div>
  <h2 style="margin-top:8px">Importar por URL</h2><input placeholder="http://historico.tsj.gob.ve/decisiones/scon/…" aria-label="URL de la sentencia"><button class="btn sec" onclick="toast('En la app real descarga la sentencia y la IA extrae sala, número, ponente, resumen y doctrina')">Importar</button></section>
  <section class="grid"><h2 style="margin:0">Mi jurisprudencia (${D.sent.length})</h2>${D.sent.map(s=>`<article class="card"><div class="small">${s[0]} · ${s[1]} <span class="chip c-warn">ejemplo</span>${s[4]?` · vinculada a <button class="link mono" data-caso="${s[4]}" data-tab="jurisprudencia">${s[4]}</button>`:""}</div><div style="font-weight:600">${esc(s[2])}</div><p style="margin:.3em 0 0;font-style:italic">${esc(s[3])}</p></article>`).join("")}</section>
 </div>`}
function facturacion(){
 const vig=D.fact.filter(f=>f[5]!=="borrador");const cobrar=vig.reduce((s,f)=>s+f[9]-f[10],0);const venc=vig.filter(f=>f[5]==="vencida").reduce((s,f)=>s+f[9]-f[10],0);
 return `<h1>Facturación</h1><p class="sub">IVA 16 %, IGTF 3 % por pago en divisas y equivalente en bolívares a tasa BCV</p>
 <div class="grid kpis"><div class="kpi"><div class="t">Por cobrar</div><div class="v">${usd(cobrar).replace("USD ","$")}</div></div><div class="kpi"><div class="t">Vencido</div><div class="v">${usd(venc).replace("USD ","$")}</div></div><div class="kpi"><div class="t">Cobrado</div><div class="v">${usd(vig.reduce((s,f)=>s+f[10],0)).replace("USD ","$")}</div></div><div class="kpi"><div class="t">Facturas</div><div class="v">${D.fact.length}</div><div class="d">1 en borrador</div></div></div>
 <div class="card scroll" style="padding:0"><table><thead><tr><th>Factura</th><th>Cliente</th><th>Caso</th><th>Emisión</th><th>Vence</th><th>Estado</th><th class="num">Total</th><th class="num">Saldo</th></tr></thead><tbody>
 ${D.fact.map(f=>`<tr class="click" data-fact="${f[0]}"><td class="mono">${f[0]}</td><td>${esc(f[1])}</td><td class="mono small">${f[2]}</td><td>${fe(f[3])}</td><td>${fe(f[4])}</td><td>${chipE(f[5])}</td><td class="num">${usd(f[9])}</td><td class="num" style="font-weight:600">${usd(f[9]-f[10])}</td></tr>`).join("")}</tbody></table></div>`}
function factura(){
 const f=D.fact.find(x=>x[0]===estado.fact);const cl=D.clientes.find(c=>c[0]===f[1]);
 return `<button class="link small" onclick="ir('facturacion')">← Facturación</button>
 <article class="card factura" style="margin-top:10px"><header><div><div style="font-family:var(--f-display);font-size:19px">Rodríguez, Pérez &amp; Asociados</div><div class="small">RIF J-40123456-7 · Av. Francisco de Miranda, Chacao, Caracas</div></div><div style="text-align:right"><div style="font-family:var(--f-display);font-size:20px">FACTURA</div><div class="mono">N.º ${f[0]}</div><div class="small">N.º de control 00-${f[0].slice(2)}</div>${chipE(f[5])}</div></header>
 <div class="barra" style="justify-content:space-between;align-items:flex-start"><div><div class="small">Cliente</div><div style="font-weight:600">${esc(f[1])}</div><div class="mono small">${cl?cl[2]:""}</div></div><div style="text-align:right" class="small">Emisión ${fe(f[3])}<br>Vence ${fe(f[4])}<br>Caso <span class="mono">${f[2]}</span><br>Tasa BCV ${bs(f[11])} / USD</div></div>
 <div class="scroll"><table><thead><tr><th>Descripción</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Total</th></tr></thead><tbody>${f[12].map(i=>`<tr><td>${esc(i[0])}</td><td class="num">${i[1]}</td><td class="num">${usd(i[2])}</td><td class="num">${usd(i[1]*i[2])}</td></tr>`).join("")}</tbody></table></div>
 <div class="tot"><div><span>Base imponible</span><span>${usd(f[6])}</span></div><div><span>IVA 16 %</span><span>${usd(f[7])}</span></div>${f[8]?`<div><span>IGTF 3 %</span><span>${usd(f[8])}</span></div>`:""}<div class="g"><span>Total</span><span>${usd(f[9])}</span></div><div class="small"><span>Equivalente</span><span>${bs(f[9]*f[11])}</span></div><div style="color:var(--ok)"><span>Pagado</span><span>${usd(f[10])}</span></div><div style="font-weight:600"><span>Saldo</span><span>${usd(f[9]-f[10])}</span></div></div>
 <div class="barra" style="margin-top:16px">${f[5]==="borrador"?'<button class="btn" onclick="toast(\'Factura emitida (simulado)\')">Emitir factura</button>':""}${["emitida","vencida","parcial"].includes(f[5])?'<button class="btn" onclick="toast(\'Pago registrado: pago móvil, Zelle, transferencia… (simulado)\')">Registrar pago</button>':""}</div></article>`}
function informes(){
 const max=Math.max(...D.horas.map(h=>h[4]));const cnt=k=>{const m={};D.casos.forEach(c=>m[c[k]]=(m[c[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const cart={};D.fact.filter(f=>f[5]!=="borrador").forEach(f=>{const c=cart[f[1]]||(cart[f[1]]=[0,0]);c[0]+=f[9];c[1]+=f[9]-f[10]});
 const bloque=(t,arr,lab)=>{const mx=Math.max(...arr.map(a=>a[1]));return `<section class="card"><h2>${t}</h2>${arr.map(([k,n])=>`<div class="fila3"><span>${lab(k)}</span><div class="meter"><span style="width:${n/mx*100}%"></span></div><span class="num">${n}</span></div>`).join("")}</section>`};
 return `<div class="barra" style="justify-content:space-between"><h1>Informes</h1><div class="barra" style="margin:0"><button class="btn sec" onclick="toast('Descarga CSV en la app real')">⤓ Casos</button><button class="btn sec" onclick="toast('Descarga CSV en la app real')">⤓ Horas</button><button class="btn sec" onclick="toast('Descarga CSV en la app real')">⤓ Facturas</button></div></div><p class="sub">Últimos 75 días</p>
 <section class="card scroll" style="margin-bottom:16px"><h2>Productividad por abogado</h2><table><thead><tr><th>Abogado</th><th class="num">Horas</th><th class="num">Facturables</th><th class="num">Utilización</th><th class="num">Valor</th><th style="width:28%"></th></tr></thead><tbody>${D.horas.map(h=>`<tr><td>${h[0]} <span class="small">${h[1]}</span></td><td class="num">${h[2]}</td><td class="num">${h[3]}</td><td class="num">${Math.round(h[3]/h[2]*100)} %</td><td class="num">${usd(h[4])}</td><td><div class="meter"><span style="width:${h[4]/max*100}%"></span></div></td></tr>`).join("")}</tbody></table></section>
 <div class="grid two">${bloque("Casos por materia",cnt("m"),k=>MAT[k])}${bloque("Casos por estado",cnt("e"),k=>EST[k][0])}</div>
 <section class="card scroll" style="margin-top:16px"><h2>Cartera por cliente</h2><table><thead><tr><th>Cliente</th><th class="num">Facturado</th><th class="num">Saldo</th></tr></thead><tbody>${Object.entries(cart).sort((a,b)=>b[1][1]-a[1][1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${usd(v[0])}</td><td class="num" style="${v[1]>0?"color:var(--bad);font-weight:600":""}">${usd(v[1])}</td></tr>`).join("")}</tbody></table></section>`}
function alertas(){
 const prox=D.plazos.filter(p=>!p[4]&&dias(p[3])<=30);
 const correos=prox.filter(p=>dias(p[3])<=3).map(p=>[`[LexVE] ${p[0]}: ${p[1]} — ${dias(p[3])===0?"vence HOY":"vence en "+dias(p[3])+" día(s)"}`,p[6]]);
 return `<div class="barra" style="justify-content:space-between"><h1>Alertas y vencimientos</h1><button class="btn" onclick="toast('Alertas generadas en modo simulación: no se envió ningún correo')">Generar y enviar alertas ahora</button></div>
 <p class="aviso" style="margin-top:4px">Modo simulación: las alertas se registran pero no se envían. El aviso automático corre cada mañana según los días configurados en cada plazo (7, 3 y 1 días antes, y al vencer).</p>
 <div class="grid two"><section class="card"><h2>Próximos 30 días</h2><ul class="lista">${prox.map(p=>`<li><div><button class="link" data-caso="${p[0]}" data-tab="plazos">${esc(p[1])}</button><div class="small"><span class="mono">${p[0]}</span> · ${TP[p[2]]} · ${fe(p[3])} · ${p[6]}</div></div>${chipDias(dias(p[3]))}</li>`).join("")}</ul></section>
 <section class="card"><h2>Correos que se generarían hoy</h2><ul class="lista">${correos.map(c=>`<li><div><div style="font-weight:500">${esc(c[0])}</div><div class="small">Para ${c[1]} y el equipo del caso · simulado</div></div></li>`).join("")}</ul></section></div>`}

function render(){
 navegar();const v=estado.v;
 $("#vista").innerHTML=v==="panel"?panel():v==="casos"?casos():v==="caso"?vistaCaso():v==="clientes"?clientes():v==="tsj"?tsj():v==="facturacion"?facturacion():v==="factura"?factura():v==="informes"?informes():alertas();
 $("#vista").classList.remove("vista");void $("#vista").offsetWidth;$("#vista").classList.add("vista");
 const q=$("#q");if(q){q.addEventListener("input",e=>{estado.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)});$("#mat").addEventListener("change",e=>{estado.mat=e.target.value;render()});$("#nuevo").addEventListener("click",()=>toast("Formulario de nuevo caso en la app real"))}
 const a=$("#analizar");if(a)a.addEventListener("click",()=>{a.textContent="Analizando…";setTimeout(()=>{a.textContent="Analizar";const c=caso(estado.caso);$("#resia").insertAdjacentHTML("afterbegin",`<article class="card ia"><div class="small">Ahora · ${esc($("#tipoia").value)} · simulación</div><div class="prosa"><p><strong>Situación:</strong> ${esc(c.d)}</p><p><strong>Etapa:</strong> ${esc(c.et)} ante ${esc(c.trib)}.</p><p><strong>Siguiente paso sugerido:</strong> revisar el próximo plazo${proxPlazo(c.c)?` (“${esc(proxPlazo(c.c)[1])}”, ${fe(proxPlazo(c.c)[3])})`:""} y preparar el escrito correspondiente.</p><p class="small">En la app real, Claude redacta aquí un análisis completo con normas aplicables, riesgos y estrategia.</p></div></article>`)},1100)});
 const b=$("#btsj");if(b)b.addEventListener("click",()=>{b.textContent="Buscando…";setTimeout(()=>{b.textContent="Buscar";$("#restsj").innerHTML=`<div class="card" style="padding:12px;margin-top:6px">En la app real, Claude busca en tsj.gob.ve y devuelve cada sentencia con sala, número, fecha, ponente, resumen y enlace, lista para guardar y vincular al caso. El prototipo no se conecta al TSJ.</div>`},900)});
}
render();
</script>

</body></html>
